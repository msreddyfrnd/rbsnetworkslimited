<!DOCTYPE html>
<html>
<head>
<title>Our Services - RBS Networks</title>

<style>

/* ===== HEADER / MENU BAR ===== */
.header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #ffffff;
    padding: 15px 30px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.logo-section {
    display: flex;
    align-items: center;
}

.logo-img {
    height: 40px;
    margin-right: 10px;
}

.logo-text {
    font-size: 20px;
    font-weight: bold;
    color: #00AEEF;
}

/* ✅ NAV FIX */
nav {
    display: flex;
    gap: 20px;
}

nav a {
    text-decoration: none;
    color: #00AEEF;
    font-weight: 500;
}

nav a:hover {
    color: #007bb5;
}

/* ===== SERVICES ===== */
.services {
    text-align: center;
    padding: 40px 20px;
}

.services h2 {
    margin-bottom: 30px;
    font-size: 28px;
}

.card {
    display: inline-block;
    width: 280px;
    margin: 15px;
    text-align: center;
    vertical-align: top;
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
}

.card a {
    display: block;
    margin-top: 10px;
    font-size: 16px;
    text-decoration: none;
    color: #333;
    font-weight: bold;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 15px;
    background-color: #f1f1f1;
    margin-top: 40px;
}

</style>
</head>

<body>

<header class="header-inner">
 
    <div class="logo-section">
        <img src="/rbs_logo.jpg" class="logo-img">
        <span class="logo-text">RBS Network Solutions</span>
    </div>

    <!-- ✅ CLEAN URL NAV -->
    <nav>
        <a href="/">Home</a>
        <a href="/services/">Services</a>
        <a href="/clients/">Clients</a>
        <a href="/contact/">Contact</a>
    </nav>

</header>

<section class="services">
    <h2>Our Services</h2>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=800&q=60">
        <a href="/networking/">IT Network Solutions</a>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1581092918056-0c4c3acd3789?auto=format&fit=crop&w=800&q=60">
        <a href="/cloud/">CCTV and Security</a>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=800&q=60">
        <a href="/security/">Telecom and Communication</a>
    </div>

</section>

<footer>
 <p>© 2025 RBS Network Solutions</p>
</footer>

</body>
</html>
