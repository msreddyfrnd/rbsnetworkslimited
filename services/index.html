<!DOCTYPE html>
<html>
<head>
<title>Our Services - RBS Networks</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ===== GENERAL ===== */
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f5f7fa;
}

/* ===== HEADER ===== */
.header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #ffffff;
    padding: 15px 30px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.logo-section {
    display: flex;
    align-items: center;
}

.logo-img {
    height: 40px;
    margin-right: 10px;
}

.logo-text {
    font-size: 20px;
    font-weight: bold;
    color: #00AEEF;
}

/* NAV */
nav {
    display: flex;
    gap: 12px;
}

nav a {
    text-decoration: none;
    background: #00AEEF;
    color: white;
    padding: 10px 18px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    transition: 0.3s;
}

nav a:hover {
    background: #007bb5;
}

/* ===== SERVICES ===== */
.services {
    text-align: center;
    padding: 50px 20px;
}

.services h2 {
    font-size: 32px;
    margin-bottom: 40px;
}

/* ✅ PERFECT ROW ALIGNMENT */
.services-container {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 30px;
    max-width: 1100px;
    margin: auto;
}

/* ✅ CARD */
.card {
    flex: 1;                /* ✅ equal size cards */
    max-width: 320px;
    min-width: 260px;
    background: #fff;
    border-radius: 15px;
    padding: 15px;
    box-sizing: border-box;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-8px);
}

/* ✅ IMAGE */
.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
}

/* ✅ TITLE */
.card a {
    display: block;
    margin-top: 12px;
    font-size: 18px;
    font-weight: 600;
    color: #222;
    text-decoration: none;
}

.card a:hover {
    color: #00AEEF;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    background: #0a2540;
    color: #ccc;
    margin-top: 40px;
}

/* ✅ MOBILE */
@media (max-width: 900px) {
    .services-container {
        flex-wrap: wrap;
    }

    .card {
        flex: none;
        width: 90%;
    }

    nav {
        flex-wrap: wrap;
        justify-content: center;
    }
}

</style>
</head>

<body>

<!-- HEADER -->
<header class="header-inner">
 
    <div class="logo-section">
        <img src="/rbs_logo.jpg" class="logo-img">
        <span class="logo-text">RBS Network Solutions</span>
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/clients/">Clients</a>
        <a href="/contact/">Contact</a>
    </nav>

</header>

<!-- SERVICES -->
<section class="services">
    <h2>Our Services</h2>

    <div class="services-container">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=800&q=60">
            <a href="/networking/">IT Network Solutions</a>
        </div>
        
        <div class="card">
            <img src="/rbs_images/cctv_image.jpg" alt="cctv">
            <a href="/cloud/">CCTV and Security</a>
        </div>

        <div class="card">
            <img src="/rbs_images/telephone_image.jpg" alt="Telephone">
            <a href="/security/">Telecom and Communication</a>
        </div>

    </div>

</section>

<!-- FOOTER -->
<footer>
 <p>© 2025 RBS Network Solutions</p>
</footer>

</body>
</html>
