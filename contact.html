<!DOCTYPE html>
<html>
<head>
<title>Contact - RBS Networks</title>
<link rel="stylesheet" href="style.css">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

/* ✅ HEADER FIX */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #4aa3c0;
  padding: 10px 30px;
}

.logo {
  color: white;
  font-size: 22px;
  font-weight: bold;
}

/* ✅ MENU RIGHT ALIGN */
nav {
  display: flex;
  gap: 20px;
}

nav a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

nav a:hover {
  text-decoration: underline;
}

/* PAGE */
.contact-page {
 padding: 40px;
 max-width: 800px;
 margin: auto;
}

.contact-page h1 {
 background-color: #4aa3c0;
 color: white;
 padding: 10px;
 text-align: center;
}

.contact-details {
 margin-top: 20px;
 font-size: 16px;
 line-height: 1.6;
}

.contact-details b {
 display: inline-block;
 width: 90px;
}

form {
 margin-top: 30px;
}

form input, form textarea {
 width: 100%;
 padding: 10px;
 margin: 8px 0;
 border: 1px solid #ccc;
 border-radius: 5px;
}

form button {
 background-color: #4aa3c0;
 color: white;
 padding: 10px 20px;
 border: none;
 border-radius: 5px;
 cursor: pointer;
}

form button:hover {
 background-color: #3a8fa8;
}

footer {
  text-align: center;
  padding: 10px;
}
</style>

</head>

<body>

<header>
 <div class="logo">RBS Networks</div>

 <!-- ✅ RIGHT SIDE MENU -->
 <nav>
   <a href="index.html">Home</a>
   <a href="services.html">Services</a>
   <a href="clients.html">Clients</a>
   <a href="index.html">Back</a>
 </nav>
</header>

<section class="contact-page">

 <h1>CONTACT US</h1>

 <div class="contact-details">
   <p><b>Address:</b></p>
   <p>
   RBS NETWORK SOLUTIONS<br>
   NO S1 GF, Shaheena Building<br>
   Kalpana Chawla Road, Boopasandra<br>
   Bangalore - 560094
   </p>

   <p><b>WhatsApp:</b> 7892554609, 9353961667</p>
   <p><b>E-Mail:</b> 
     <a href="mailto:rbsnetworks2025@gmail.com">
       rbsnetworks2025@gmail.com
     </a>
   </p>
 </div>

 <!-- ✅ CONTACT FORM -->
 <form id="contact-form">
   <input type="text" name="user_name" placeholder="Your Name" required>
   <input type="email" name="user_email" placeholder="Your Email" required>
   <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
   <button type="submit">Send Message</button>
 </form>

</section>

<footer>
 <p>© 2025 RBS Networks</p>
</footer>

<!-- ✅ EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
(function(){
  emailjs.init("riy_HNT0u1AZG6RW_");
})();

document.getElementById("contact-form").addEventListener("submit", function(e) {
 e.preventDefault();

 emailjs.sendForm(
   "service_qchh8fa",
   "template_o45g477",
   this
 )
 .then(function() {
   alert("✅ Message sent successfully!");
 })
 .catch(function(error) {
   alert("❌ Error: " + error.text);
   console.log(error);
 });

 this.reset();
});
</script>

</body>
</html>
