<!DOCTYPE html>
<html>
<head>
<title>Contact - RBS Network Solutions</title>
<link rel="stylesheet" href="style.css">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #4aa3c0;
  padding: 10px 30px;
}

nav {
  display: flex;
  gap: 20px;
}

nav a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

.contact-page {
 padding: 40px;
 max-width: 800px;
 margin: auto;
}

.contact-page h1 {
 background-color: #4aa3c0;
 color: white;
 padding: 10px;
 text-align: center;
}

.contact-details {
 margin-top: 20px;
 font-size: 16px;
 line-height: 1.6;
}

form {
 margin-top: 30px;
}

form input, form textarea {
 width: 100%;
 padding: 10px;
 margin: 8px 0;
 border: 1px solid #ccc;
 border-radius: 5px;
}

form button {
 background-color: #4aa3c0;
 color: white;
 padding: 10px 20px;
 border: none;
 border-radius: 5px;
 cursor: pointer;
}

form button:hover {
 background-color: #3a8fa8;
}

footer {
  text-align: center;
  padding: 10px;
}
</style>

</head>

<body>

<header>
  <div class="container header-inner">
        <div class="logo-section">
            <img src="rbs_logo.jpg" class="logo-img">
            <span class="logo-text" style="color:white;font-weight:bold;">RBS Network Solutions</span>
        </div>
     <nav>
       <a href="index.html">Home</a>
       <a href="services.html">Services</a>
       <a href="clients.html">Clients</a>
       <a href="index.html">Back</a>
     </nav>
  </div>
</header>

<section class="contact-page">

 <h1>CONTACT US</h1>

 <div class="contact-details">
   <p><b>Address:</b></p>
   <p>
   RBS NETWORK SOLUTIONS<br>
   NO S1 GF, Shaheena Building<br>
   Kalpana Chawla Road, Boopasandra<br>
   Bangalore - 560094
   </p>

   <p><b>WhatsApp:</b> 7892554609, 9353961667</p>
   <p><b>E-Mail:</b> 
     <a href="mailto:rbsnetworks2025@gmail.com">
       rbsnetworks2025@gmail.com
     </a>
   </p>
 </div>

 <!-- ✅ CONTACT FORM -->
 <form id="contact-form">
   <input type="text" name="from_name" placeholder="Your Name" required>

   <input type="email" name="from_email" placeholder="Your Email" required>

   <!-- ✅ Mobile Number Field -->
   <input type="tel" name="mobile" placeholder="Mobile Number (10 digits)" 
          pattern="[0-9]{10}" title="Enter 10-digit mobile number" required>

   <textarea name="message" placeholder="Your Message" rows="5" required></textarea>

   <button type="submit">Send Message</button>
 </form>

</section>

<footer>
 <p>© 2025 RBS Networks</p>
</footer>

<!-- ✅ EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
(function(){
  emailjs.init("riy_HNT0u1AZG6RW_");
})();

document.getElementById("contact-form").addEventListener("submit", function(e) {
 e.preventDefault();

 let mobile = document.querySelector("input[name='mobile']").value;

 // ✅ Extra validation (JS)
 if(!/^[0-9]{10}$/.test(mobile)){
    alert("❌ Please enter a valid 10-digit mobile number");
    return;
 }

 // ✅ Send to ADMIN (2 emails via template)
 emailjs.sendForm(
   "service_qchh8fa",
   "template_scxt23s",
   this
 );

 // ✅ Auto reply
 emailjs.sendForm(
   "service_qchh8fa",
   "auto_reply_template",
   this
 );

 alert("✅ Message sent successfully!");
 this.reset();
});
</script>

</body>
</html>
