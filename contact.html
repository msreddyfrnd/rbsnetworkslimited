<!DOCTYPE html>
<html>
<head>
<title>Contact - RBS Networks</title>
<link rel="stylesheet" href="style.css">

<style>
.contact-page {
    padding: 40px;
    max-width: 800px;
    margin: auto;
}

.contact-page h1 {
    background-color: #4aa3c0;
    color: white;
    padding: 10px;
    text-align: center;
}

.contact-details {
    margin-top: 20px;
}

form {
    margin-top: 30px;
}

form input, form textarea {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

form button {
    background-color: #4aa3c0;
    color: white;
    padding: 10px;
    border: none;
    cursor: pointer;
}

form button:hover {
    background-color: #3a8fa8;
}
</style>

</head>

<body>

<section class="contact-page">
  <h1>CONTACT US</h1>

  <form id="contact-form">
    <input type="text" name="user_name" placeholder="Your Name" required>
    <input type="email" name="user_email" placeholder="Your Email" required>
    <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
    <button type="submit">Send Message</button>
  </form>
</section>

<!-- ✅ EmailJS latest SDK -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
(function(){
  emailjs.init("riy_HNT0u1AZG6RW_");  // 🔴 Replace this
})();

document.getElementById("contact-form").addEventListener("submit", function(e) {
  e.preventDefault();

  emailjs.sendForm(
    "service_qchh8fa",        // ✅ Your Service ID
    "template_o45g477",       // 🔴 Replace this
    this
  )
  .then(function() {
    alert("✅ Message sent successfully!");
  }, function(error) {
    alert("❌ Failed: " + JSON.stringify(error));
    console.log(error);
  });

  this.reset();
});
</script>

</body>
</html>
