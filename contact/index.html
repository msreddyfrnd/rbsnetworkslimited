<!DOCTYPE html>
<html>
<head>
<title>Contact - RBS Network Solutions</title>
<link rel="stylesheet" href="style.css">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

/* ✅ HEADER UPDATED */
header {
  background-color: #ffffff; /* white */
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* ✅ ALIGN HEADER */
.header-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 40px;
}

/* ✅ LOGO */
.logo-section {
  display: flex;
  align-items: center;
}

.logo-img {
  height: 40px;
  margin-right: 10px;
}

.logo-text {
  color: #00AEEF; /* light blue */
  font-weight: bold;
  font-size: 20px;
}

/* ✅ MENU */
nav {
  display: flex;
  gap: 25px;
}

nav a {
  color: #00AEEF; /* match logo */
  text-decoration: none;
  font-weight: 600;
}

nav a:hover {
  color: #007bb5;
}

.contact-page {
 padding: 40px;
 max-width: 800px;
 margin: auto;
}

.contact-page h1 {
 background-color: #00AEEF; /* match theme */
 color: white;
 padding: 10px;
 text-align: center;
}

.contact-details {
 margin-top: 20px;
 font-size: 16px;
 line-height: 1.6;
}

form {
 margin-top: 30px;
}

form input, form textarea {
 width: 100%;
 padding: 10px;
 margin: 8px 0;
 border: 1px solid #ccc;
 border-radius: 5px;
}

form button {
 background-color: #00AEEF;
 color: white;
 padding: 10px 20px;
 border: none;
 border-radius: 5px;
 cursor: pointer;
}

form button:hover {
 background-color: #007bb5;
}

footer {
  text-align: center;
  padding: 10px;
}
</style>

</head>

<body>

<!-- ✅ HEADER -->
<header>
  <div class="header-inner">

        <div class="logo-section">
            <img src="rbs_logo.jpg" class="logo-img">
            <span class="logo-text">RBS Network Solutions</span>
        </div>

     <nav>
       <a href="index.html">Home</a>
       <a href="services.html">Services</a>
       <a href="clients.html">Clients</a>
       <a href="index.html">Back</a>
     </nav>

  </div>
</header>

<section class="contact-page">

 <h1>CONTACT US</h1>

 <div class="contact-details">
   <p><b>Address:</b></p>
   <p>
   RBS NETWORK SOLUTIONS<br>
   NO S1 GF, Shaheena Building<br>
   Kalpana Chawla Road, Boopasandra<br>
   Bangalore - 560094
   </p>

   <p><b>WhatsApp:</b> 7892554609, 9353961667</p>
   <p><b>E-Mail:</b> 
     <a href="mailto:rbsnetworks2025@gmail.com">
       rbsnetworks2025@gmail.com
     </a>
   </p>
 </div>

 <!-- ✅ CONTACT FORM -->
 <form id="contact-form">
   <input type="text" name="from_name" placeholder="Your Name" required>

   <input type="email" name="from_email" placeholder="Your Email" required>

   <input type="tel" name="mobile" placeholder="Mobile Number (10 digits)" 
          pattern="[0-9]{10}" title="Enter 10-digit mobile number" required>

   <textarea name="message" placeholder="Your Message" rows="5" required></textarea>

   <button type="submit">Send Message</button>
 </form>

</section>

<footer>
 <p>© 2025 RBS Networks</p>
</footer>

<!-- ✅ EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
(function(){
  emailjs.init("riy_HNT0u1AZG6RW_");
})();

document.getElementById("contact-form").addEventListener("submit", function(e) {
 e.preventDefault();

 let mobile = document.querySelector("input[name='mobile']").value;

 if(!/^[0-9]{10}$/.test(mobile)){
    alert("❌ Please enter a valid 10-digit mobile number");
    return;
 }

 emailjs.sendForm(
   "service_qchh8fa",
   "template_scxt23s",
   this
 );

 emailjs.sendForm(
   "service_qchh8fa",
   "auto_reply_template",
   this
 );

 alert("✅ Message sent successfully!");
 this.reset();
});
</script>

</body>
</html>
