<!DOCTYPE html>
<html>
<head>
    <title>RBS Networks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* RESET */
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* ✅ HEADER */
header {
    background: #ffffff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* ✅ CONTAINER */
.container {
    max-width: 1200px;
    margin: auto;
    padding: 0 20px;
}

/* ✅ HEADER ALIGNMENT */
.header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
}

/* ✅ LOGO */
.logo-section {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-img {
    height: 40px;
}

/* ✅ MATCH LOGO LIGHT BLUE */
.logo-text {
    color: #00AEEF;
    font-size: 22px;
    font-weight: bold;
}

/* ✅ NAV */
nav {
    display: flex;
    gap: 25px;
}

/* ✅ MENU COLOR MATCHED */
nav a {
    color: #00AEEF;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
}

nav a:hover {
    color: #007bb5; /* darker hover */
}

/* ✅ HERO */
.hero {
    background: linear-gradient(to right, #0a2540, #007bff);
    color: white;
    text-align: center;
    padding: 80px 20px;
}

.hero h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.hero p {
    font-size: 18px;
}

/* ✅ BUTTON */
.btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 25px;
    background: #00AEEF;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

.btn:hover {
    background: #007bb5;
}

/* ✅ SECTION */
.section {
    padding: 60px 20px;
    text-align: center;
}

.section-title {
    font-size: 28px;
    margin-bottom: 30px;
}

/* ✅ STATS */
.stats {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
}

.stat-box {
    background: #f5f5f5;
    padding: 25px;
    border-radius: 10px;
    width: 150px;
}

.stat-box h2 {
    color: #00AEEF;
}

/* ✅ FOOTER */
footer {
    background: #0a2540;
    color: white;
    text-align: center;
    padding: 20px;
}

/* ✅ MOBILE */
@media (max-width: 768px) {
    .header-inner {
        flex-direction: column;
        gap: 10px;
    }

    nav {
        flex-wrap: wrap;
        justify-content: center;
    }

    .hero h1 {
        font-size: 28px;
    }
}

</style>
</head>

<body>

<!-- HEADER -->
<header>
    <div class="container header-inner">
        <div class="logo-section">
            <img src="rbs_logo.jpg" class="logo-img">
            <span class="logo-text">RBS Network Solutions</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="/about/">About</a>
            <a href="/services/">Services</a>
            <a href="/clients/">Clients</a>
            <a href="/contact/">Contact</a>
        </nav>
    </div>
</header>

<!-- HERO -->
<section class="hero">
    <div class="container hero-inner">
        <h1>Cloud & Networking Experts</h1>
        <p>Professional IT Infrastructure, Security, Telecom & Networking Solutions</p>
        <a class="btn" href="services.html">Explore Services</a>
    </div>
</section>

<!-- SECTION -->
<section class="section">
    <div class="container">
        <h2 class="section-title">Why Choose Us</h2>

        <div class="stats">
            <div class="stat-box">
                <h2>150+</h2>
                <p>Projects</p>
            </div>

            <div class="stat-box">
                <h2>80+</h2>
                <p>Clients</p>
            </div>

            <div class="stat-box">
                <h2>15+</h2>
                <p>Years Experience</p>
            </div>
        </div>
    </div>
</section>

<!-- FOOTER -->
<footer>
    © 2025 RBS Networks
</footer>

</body>
</html>
