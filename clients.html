<!DOCTYPE html>
<html>

<head>
<title>Clients - RBS Networks</title>

<style>

/* ✅ HEADER SAME AS OTHER PAGES */
.header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: #87CEFA;
    padding: 15px 40px;
}

.logo-section {
    display: flex;
    align-items: center;
}

.logo-img {
    height: 40px;
    margin-right: 10px;
}

.logo-text {
    font-size: 20px;
    font-weight: bold;
}

/* ✅ MENU */
nav a {
    margin-left: 25px;
    text-decoration: none;
    color: #000;
    font-weight: 500;
}

nav a:hover {
    color: #1d4ed8;
}

/* ✅ CLIENT SECTION */
.clients {
    text-align: center;
    padding: 50px;
}

.clients h1 {
    font-size: 32px;
}

/* ✅ GRID */
.client-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 30px;
    margin-top: 30px;
}

/* ✅ CARD */
.client-card {
    padding: 20px;
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    transition: 0.3s;

    /* ✅ Horizontal + vertical alignment fix */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 240px;
}

.client-card:hover {
    transform: translateY(-6px);
}

/* ✅ IMAGE */
.client-card img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    margin-bottom: 15px;
    background: #f1f5f9;
    padding: 10px;
    border-radius: 8px;
}

/* ✅ TEXT */
.client-card h2 {
    font-size: 15px;
    font-weight: bold;
    margin: 0;
}

/* ✅ FOOTER */
footer {
    text-align: center;
    padding: 15px;
    background: #000;
    color: #fff;
}

</style>

</head>

<body>

<!-- ✅ HEADER -->
<header class="header-inner">

  <div class="logo-section">
    <img src="rbs_logo.jpg" class="logo-img" alt="Logo">
    <span class="logo-text">RBS Network Solutions</span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="clients.html">Clients</a>
    <a href="contact.html">Contact</a>
  </nav>

</header>

<!-- ✅ CLIENTS -->
<section class="clients">
  <h1>Our Clients</h1>

  <div class="client-list">

    <div class="client-card">
      <img src="rbs_images/zoomcar.png" alt="Zoomcar">
      <h2>Zoomcars India Private Limited</h2>
    </div>

    <div class="client-card">
      <img src="rbs_images/bmrcl.png" alt="BMRCL">
      <h2>Bangalore Metro Rail Project (BMRCL)</h2>
    </div>

    <div class="client-card">
      <img src="rbs_images/mantri.png" alt="Mantri">
      <h2>Mantri Square</h2>
    </div>

    <div class="client-card">
      <img src="rbs_images/nexus.png" alt="Nexus">
      <h2>Nexus Whitefield</h2>
    </div>

    <div class="client-card">
      <img src="rbs_images/prestige.png" alt="Prestige">
      <h2>Prestige Rex Walk</h2>
    </div>

    <div class="client-card">
      <img src="rbs_images/godrej.png" alt="Godrej">
      <h2>Godrej Centurian</h2>
    </div>

    <div class="client-card">
      <img src="rbs_images/jockey.png" alt="Jockey">
      <h2>Jockey</h2>
    </div>

  </div>

</section>

<!-- ✅ FOOTER -->
<footer>
  <p>© 2026 RBS Networks</p>
</footer>

</body>
</html>
